<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In — StudyAI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body style="background: var(--bg-secondary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6);">

    <div class="card-elevated" style="width: 100%; max-width: 420px; padding: var(--space-8); background: var(--bg-primary); border-radius: var(--radius-xl);">
        <!-- Logo -->
        <div class="flex-center flex-col" style="margin-bottom: var(--space-6);">
            <a href="index.html" class="nav-logo" style="margin-bottom: var(--space-2);">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>StudyAI</span>
            </a>
            <h1 class="text-2xl font-bold" style="margin-top: 10px;">Welcome Back</h1>
            <p class="text-xs text-secondary" style="margin-top: 4px;">Log in to resume your study plans.</p>
        </div>

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-control" placeholder="student@example.com" required>
                <div class="form-error" id="email-error">Invalid email address.</div>
            </div>
            <div class="form-group">
                <div class="flex-between" style="margin-bottom: var(--space-2);">
                    <label for="login-password" style="margin-bottom: 0;">Password</label>
                    <a href="#" style="font-size: 0.8rem; color: var(--green-600); font-weight: 500;">Forgot?</a>
                </div>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                <div class="form-error" id="password-error">Incorrect password.</div>
            </div>
            
            <div class="form-group" style="margin-top: var(--space-4);">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember me for 30 days</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);" id="login-btn">Log In</button>
        </form>

        <div class="divider" style="margin: var(--space-6) 0;"></div>

        <p class="text-sm text-center text-secondary">
            Don't have an account? <a href="signup.html" style="color: var(--green-600); font-weight: 600;">Sign Up</a>
        </p>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                
                // Fetch registered list
                const users = Storage.get('registered_users', []);
                const matchedUser = users.find(u => u.email === email && u.password === password);
                
                if (matchedUser) {
                    // Save user session
                    Storage.set('user_session', {
                        name: matchedUser.name,
                        email: matchedUser.email
                    });
                    
                    showToast('Welcome back, ' + matchedUser.name + '!', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                } else {
                    // Try to see if email exists but password wrong
                    const userExists = users.some(u => u.email === email);
                    if (userExists) {
                        document.getElementById('login-password').classList.add('error');
                        showToast('Incorrect password. Please try again.', 'error');
                    } else {
                        document.getElementById('login-email').classList.add('error');
                        showToast('Account not found. Sign up to register.', 'warning');
                    }
                }
            });
            
            // Clear errors on typing
            document.querySelectorAll('.form-control').forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('error');
                });
            });
        });
    </script>
</body>
</html>
