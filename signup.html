<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — StudyAI</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dark-mode.css">
</head>
<body style="background: var(--bg-secondary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-6);">

    <div class="card-elevated" style="width: 100%; max-width: 440px; padding: var(--space-8); background: var(--bg-primary); border-radius: var(--radius-xl);">
        <!-- Logo -->
        <div class="flex-center flex-col" style="margin-bottom: var(--space-6);">
            <a href="index.html" class="nav-logo" style="margin-bottom: var(--space-2);">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                <span>StudyAI</span>
            </a>
            <h1 class="text-2xl font-bold" style="margin-top: 10px;">Create Account</h1>
            <p class="text-xs text-secondary" style="margin-top: 4px;">Sign up to generate personalized study timetables.</p>
        </div>

        <form id="signup-form">
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" class="form-control" placeholder="Jane Doe" required>
            </div>
            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" class="form-control" placeholder="student@example.com" required>
                <div class="form-error" id="email-error">This email is already registered.</div>
            </div>
            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
                <div class="password-strength" id="pwd-strength">
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
                <div class="form-hint">Must be at least 6 characters.</div>
            </div>
            <div class="form-group">
                <label for="signup-confirm">Confirm Password</label>
                <input type="password" id="signup-confirm" class="form-control" placeholder="••••••••" required>
                <div class="form-error" id="confirm-error">Passwords do not match.</div>
            </div>
            
            <div class="form-group" style="margin-top: var(--space-4);">
                <div class="checkbox-group">
                    <input type="checkbox" id="terms-agree" required>
                    <label for="terms-agree">I agree to the <a href="#" style="color:var(--green-600);">Terms & Conditions</a></label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: var(--space-4);" id="signup-btn">Create Free Account</button>
        </form>

        <div class="divider" style="margin: var(--space-6) 0;"></div>

        <p class="text-sm text-center text-secondary">
            Already have an account? <a href="login.html" style="color: var(--green-600); font-weight: 600;">Log In</a>
        </p>
    </div>

    <!-- Scripts -->
    <script src="js/utils.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signup-form');
            const pwdInput = document.getElementById('signup-password');
            const strengthBar = document.getElementById('pwd-strength');
            
            // Password Strength Indicator
            pwdInput.addEventListener('input', () => {
                const val = pwdInput.value;
                strengthBar.className = 'password-strength';
                
                if (val.length === 0) return;
                
                if (val.length < 5) {
                    strengthBar.classList.add('weak');
                } else if (val.length < 8) {
                    strengthBar.classList.add('medium');
                } else if (/[A-Z]/.test(val) && /[0-9]/.test(val)) {
                    strengthBar.classList.add('very-strong');
                } else {
                    strengthBar.classList.add('strong');
                }
            });

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('signup-name').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const password = pwdInput.value;
                const confirm = document.getElementById('signup-confirm').value;
                
                // 1. Password Matching Validation
                if (password !== confirm) {
                    const confirmEl = document.getElementById('signup-confirm');
                    confirmEl.classList.add('error');
                    showToast('Passwords do not match.', 'error');
                    return;
                }
                
                // 2. Email duplication check
                const users = Storage.get('registered_users', []);
                if (users.some(u => u.email === email)) {
                    const emailEl = document.getElementById('signup-email');
                    emailEl.classList.add('error');
                    showToast('This email is already registered.', 'warning');
                    return;
                }
                
                // 3. Save User
                users.push({ name, email, password });
                Storage.set('registered_users', users);
                
                // 4. Login session creation
                Storage.set('user_session', { name, email });
                
                showToast('Registration successful! Welcome, ' + name, 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            });
            
            // Clear error rings
            document.querySelectorAll('.form-control').forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('error');
                });
            });
        });
    </script>
</body>
</html>
